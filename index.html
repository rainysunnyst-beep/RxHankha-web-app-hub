<!DOCTYPE html>
<html lang="th" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Web App Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'Prompt', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Prompt', 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 dark:bg-slate-950 dark:text-slate-100 min-h-screen transition-colors duration-300 flex flex-col">

    <!-- Header -->
    <header class="sticky top-0 z-30 backdrop-blur-md bg-white/80 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="w-10 h-10 rounded-xl bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
                    <i class="fa-solid fa-layer-group text-lg"></i>
                </div>
                <h1 class="text-xl font-bold tracking-tight bg-gradient-to-r from-indigo-600 to-violet-600 bg-clip-text text-transparent">
                    My Web App Hub
                </h1>
            </div>

            <!-- Actions -->
            <div class="flex items-center space-x-2 sm:space-x-3">
                <button type="button" onclick="exportData()" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="ส่งออกข้อมูล (Export)">
                    <i class="fa-solid fa-file-arrow-down text-sm"></i>
                </button>
                <button type="button" onclick="document.getElementById('importFile').click()" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors" title="นำเข้าข้อมูล (Import)">
                    <i class="fa-solid fa-file-arrow-up text-sm"></i>
                </button>
                <input type="file" id="importFile" accept=".json" class="hidden" onchange="importData(event)">

                <button type="button" onclick="openModal()" class="inline-flex items-center space-x-2 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium px-4 py-2 rounded-xl shadow-sm transition-all duration-200 active:scale-95 cursor-pointer">
                    <i class="fa-solid fa-plus"></i>
                    <span class="hidden sm:inline">เพิ่มลิงก์ใหม่</span>
                </button>
                <button type="button" onclick="toggleDarkMode()" class="w-10 h-10 rounded-xl border border-slate-200 dark:border-slate-800 flex items-center justify-center text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                    <i id="themeIcon" class="fa-solid fa-moon"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full">
        <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 mb-8">
            <div class="relative flex-grow max-w-md">
                <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
                    <i class="fa-solid fa-search"></i>
                </span>
                <input type="text" id="searchInput" oninput="filterApps()" placeholder="ค้นหาชื่อแอป หรือคำอธิบาย..." 
                    class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 shadow-sm transition-all">
            </div>

            <div id="categoryTabs" class="flex items-center space-x-2 overflow-x-auto pb-2 md:pb-0"></div>
        </div>

        <div id="appGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-5"></div>

        <div id="emptyState" class="hidden flex-col items-center justify-center py-16 text-center">
            <div class="w-16 h-16 rounded-2xl bg-slate-100 dark:bg-slate-800 flex items-center justify-center text-slate-400 text-2xl mb-4">
                <i class="fa-solid fa-folder-open"></i>
            </div>
            <h3 class="text-lg font-semibold text-slate-700 dark:text-slate-300">ไม่พบเว็บแอปที่คุณค้นหา</h3>
            <p class="text-sm text-slate-400 mt-1">ลองเปลี่ยนคำค้นหา หรือเพิ่มลิงก์ใหม่ของคุณได้เลย</p>
        </div>
    </main>

    <footer class="border-t border-slate-200 dark:border-slate-800 py-6 text-center text-xs text-slate-400">
        &copy; 2026 My Web App Hub.
    </footer>

    <!-- Modal -->
    <div id="appModal" class="fixed inset-0 z-50 flex items-center justify-center bg-slate-950/60 backdrop-blur-sm hidden">
        <div class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-2xl shadow-2xl w-full max-w-md mx-4 overflow-hidden max-h-[90vh] overflow-y-auto">
            <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-800 flex items-center justify-between sticky top-0 bg-white dark:bg-slate-900 z-10">
                <h3 id="modalTitle" class="font-bold text-lg text-slate-800 dark:text-slate-100">เพิ่มลิงก์ Web App ใหม่</h3>
                <button type="button" onclick="closeModal()" class="w-8 h-8 rounded-lg text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>
            <form id="appForm" onsubmit="saveApp(event)" class="p-6 space-y-4">
                <input type="hidden" id="appIndex">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase mb-1">ชื่อแอปพลิเคชัน</label>
                    <input type="text" id="appName" required placeholder="เช่น ระบบจัดตารางเวร" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase mb-1">ลิงก์ URL</label>
                    <input type="url" id="appUrl" required placeholder="https://example.com" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase mb-1">หมวดหมู่</label>
                    <input type="text" id="appCategory" required list="categoryList" placeholder="เช่น เครื่องมือช่วยทำงาน" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                    <datalist id="categoryList"></datalist>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase mb-1">ไอคอน (เลือกอัปโหลดรูปภาพ หรือพิมพ์ Emoji)</label>
                    <div class="flex items-center space-x-3">
                        <input type="text" id="appIcon" required value="🌐" placeholder="เช่น 📊 หรือเลือกอัปโหลดรูป" 
                            class="flex-grow px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <label class="cursor-pointer bg-slate-100 dark:bg-slate-800 hover:bg-slate-200 dark:hover:bg-slate-700 px-4 py-2.5 rounded-xl text-xs font-medium text-slate-600 dark:text-slate-300 border border-slate-200 dark:border-slate-700 transition-all flex items-center space-x-1.5 whitespace-nowrap">
                            <i class="fa-solid fa-image"></i>
                            <span>เลือกรูปไอคอน</span>
                            <input type="file" accept="image/*" class="hidden" onchange="handleIconUpload(event)">
                        </label>
                    </div>
                </div>
                <div>
                    <label class="block text-xs font-semibold text-slate-600 dark:text-slate-400 uppercase mb-1">คำอธิบายสั้นๆ</label>
                    <input type="text" id="appDesc" required placeholder="อธิบายการใช้งานสั้นๆ 1 บรรทัด" 
                        class="w-full px-3.5 py-2.5 bg-slate-50 dark:bg-slate-800/50 border border-slate-200 dark:border-slate-700 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500">
                </div>
                <div class="pt-2 flex items-center justify-end space-x-3">
                    <button type="button" onclick="closeModal()" class="px-4 py-2.5 text-sm font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800 rounded-xl">ยกเลิก</button>
                    <button type="submit" class="px-5 py-2.5 bg-indigo-600 hover:bg-indigo-700 text-white text-sm font-medium rounded-xl shadow-sm">บันทึก</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        // กำหนดรายการแอปเริ่มต้นตรงนี้ (สามารถเพิ่มแอปของคุณต่อในนี้ได้เลย)
        const defaultApps = [
            {
                name: "ระบบจัดตารางเวร",
                url: "https://play.google.com/store/apps/details?id=com.nbmedia.myschedule&hl=th",
                category: "เครื่องมือช่วยทำงาน",
                icon: "📅",
                desc: "ใช้สำหรับจัดตารางเวร กลุ่มงานเภสัชกรรมและคุ้มครองผู้บริโภค"
            }
        ];

        function loadApps() {
            try {
                const saved = localStorage.getItem('my_web_apps');
                if (saved) {
                    const parsed = JSON.parse(saved);
                    // ถ้าในเครื่องมีข้อมูลอยู่แล้วและเป็น Array ที่มีข้อมูล ให้ใช้ค่านั้น
                    if (Array.isArray(parsed) && parsed.length > 0) {
                        return parsed;
                    }
                }
                // ถ้าไม่มี หรือข้อมูลว่างเปล่า ให้คืนค่า defaultApps ทันที
                return defaultApps;
            } catch (e) {
                return defaultApps;
            }
        }

        function persistApps(data) {
            try {
                localStorage.setItem('my_web_apps', JSON.stringify(data));
            } catch (e) {
                alert("ไม่สามารถบันทึกข้อมูลลงเบราว์เซอร์ได้");
            }
        }

        let apps = loadApps();
        let currentCategory = 'ทั้งหมด';

        try {
            if (localStorage.getItem('theme') === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('themeIcon').className = 'fa-solid fa-sun';
            }
        } catch (e) {}

        function toggleDarkMode() {
            const isDark = document.documentElement.classList.toggle('dark');
            document.getElementById('themeIcon').className = isDark ? 'fa-solid fa-sun' : 'fa-solid fa-moon';
            try { localStorage.setItem('theme', isDark ? 'dark' : 'light'); } catch (e) {}
        }

        function render() {
            renderTabs();
            renderApps();
            updateCategoryDatalist();
        }

        function renderTabs() {
            const categories = ['ทั้งหมด', ...new Set(apps.map(a => a.category))];
            const container = document.getElementById('categoryTabs');
            container.innerHTML = '';

            categories.forEach(cat => {
                const btn = document.createElement('button');
                btn.type = 'button';
                const isActive = currentCategory === cat;
                btn.className = `px-4 py-2 rounded-xl text-sm font-medium whitespace-nowrap transition-all ${
                    isActive 
                    ? 'bg-indigo-600 text-white shadow-sm' 
                    : 'bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'
                }`;
                btn.textContent = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    renderTabs();
                    renderApps();
                };
                container.appendChild(btn);
            });
        }

        function renderApps() {
            const searchInput = document.getElementById('searchInput');
            const searchQuery = searchInput ? searchInput.value.toLowerCase() : '';
            const grid = document.getElementById('appGrid');
            const emptyState = document.getElementById('emptyState');

            if (!grid) return;

            const filtered = apps.map((app, index) => ({ ...app, originalIndex: index }))
                .filter(app => {
                    const matchCategory = currentCategory === 'ทั้งหมด' || app.category === currentCategory;
                    const matchSearch = (app.name && app.name.toLowerCase().includes(searchQuery)) || 
                                        (app.desc && app.desc.toLowerCase().includes(searchQuery));
                    return matchCategory && matchSearch;
                });

            grid.innerHTML = '';

            if (filtered.length === 0) {
                if (emptyState) {
                    emptyState.classList.remove('hidden');
                    emptyState.classList.add('flex');
                }
                return;
            } else {
                if (emptyState) {
                    emptyState.classList.remove('flex');
                    emptyState.classList.add('hidden');
                }
            }

            filtered.forEach(app => {
                const card = document.createElement('div');
                card.className = "group relative bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl p-5 shadow-sm hover:shadow-xl hover:border-indigo-500/50 transition-all flex flex-col justify-between";
                
                let iconHtml = '';
                if (app.icon && app.icon.startsWith('data:image')) {
                    iconHtml = `<img src="${app.icon}" class="w-full h-full object-cover rounded-xl" />`;
                } else if (app.icon && app.icon.startsWith('fa-')) {
                    iconHtml = `<i class="${app.icon} text-indigo-600 dark:text-indigo-400 text-xl"></i>`;
                } else {
                    iconHtml = `<span class="text-2xl">${app.icon || '🌐'}</span>`;
                }

                card.innerHTML = `
                    <div>
                        <div class="flex items-start justify-between mb-3">
                            <div class="w-12 h-12 rounded-xl bg-indigo-50 dark:bg-indigo-950/50 border border-indigo-100 dark:border-indigo-900/50 flex items-center justify-center overflow-hidden">
                                ${iconHtml}
                            </div>
                            <div class="flex items-center space-x-1 opacity-100 sm:opacity-0 sm:group-hover:opacity-100 transition-opacity">
                                <button type="button" onclick="editApp(${app.originalIndex})" class="w-8 h-8 rounded-lg text-slate-400 hover:text-indigo-600 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center" title="แก้ไข">
                                    <i class="fa-solid fa-pen text-xs"></i>
                                </button>
                                <button type="button" onclick="deleteApp(${app.originalIndex})" class="w-8 h-8 rounded-lg text-slate-400 hover:text-rose-600 hover:bg-slate-100 dark:hover:bg-slate-800 flex items-center justify-center" title="ลบ">
                                    <i class="fa-solid fa-trash text-xs"></i>
                                </button>
                            </div>
                        </div>
                        <span class="inline-block px-2.5 py-0.5 rounded-full text-[11px] font-medium bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-400 mb-2">${app.category}</span>
                        <h3 class="font-bold text-slate-800 dark:text-slate-100 text-base mb-1 truncate">${app.name}</h3>
                        <p class="text-xs text-slate-500 dark:text-slate-400 line-clamp-1 mb-4">${app.desc}</p>
                    </div>
                    <a href="${app.url}" target="_blank" rel="noopener noreferrer" class="w-full inline-flex items-center justify-center space-x-2 bg-slate-50 dark:bg-slate-800/60 hover:bg-indigo-600 hover:text-white text-slate-700 dark:text-slate-200 text-xs font-medium py-2.5 px-3 rounded-xl transition-all">
                        <span>เปิดใช้งานแอป</span>
                        <i class="fa-solid fa-arrow-up-right-from-square text-[10px]"></i>
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        function filterApps() { renderApps(); }

        function updateCategoryDatalist() {
            const categories = [...new Set(apps.map(a => a.category))];
            const datalist = document.getElementById('categoryList');
            if (!datalist) return;
            datalist.innerHTML = '';
            categories.forEach(cat => {
                const option = document.createElement('option');
                option.value = cat;
                datalist.appendChild(option);
            });
        }

        function handleIconUpload(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                document.getElementById('appIcon').value = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function exportData() {
            const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(apps, null, 2));
            const a = document.createElement('a');
            a.href = dataStr;
            a.download = "my_web_apps_backup.json";
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        function importData(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                try {
                    const imported = JSON.parse(e.target.result);
                    if (Array.isArray(imported)) {
                        if (confirm(`พบข้อมูล ${imported.length} รายการ ต้องการนำเข้าแทนที่ข้อมูลเดิมหรือไม่?`)) {
                            apps = imported;
                            persistApps(apps);
                            currentCategory = 'ทั้งหมด';
                            render();
                        }
                    } else {
                        alert("รูปแบบไฟล์ไม่ถูกต้อง");
                    }
                } catch (err) {
                    alert("ไม่สามารถอ่านไฟล์ได้");
                }
                event.target.value = '';
            };
            reader.readAsText(file, "UTF-8");
        }

        function openModal(index = null) {
            const modal = document.getElementById('appModal');
            if (modal) modal.classList.remove('hidden');

            if (index !== null) {
                document.getElementById('modalTitle').textContent = 'แก้ไขลิงก์ Web App';
                document.getElementById('appIndex').value = index;
                document.getElementById('appName').value = apps[index].name;
                document.getElementById('appUrl').value = apps[index].url;
                document.getElementById('appCategory').value = apps[index].category;
                document.getElementById('appIcon').value = apps[index].icon || '🌐';
                document.getElementById('appDesc').value = apps[index].desc;
            } else {
                document.getElementById('modalTitle').textContent = 'เพิ่มลิงก์ Web App ใหม่';
                document.getElementById('appForm').reset();
                document.getElementById('appIndex').value = '';
                document.getElementById('appIcon').value = '🌐';
            }
        }

        function closeModal() {
            const modal = document.getElementById('appModal');
            if (modal) modal.classList.add('hidden');
        }

        function saveApp(event) {
            event.preventDefault();
            const index = document.getElementById('appIndex').value;
            let urlVal = document.getElementById('appUrl').value.trim();
            if (!urlVal.startsWith('http://') && !urlVal.startsWith('https://')) {
                urlVal = 'https://' + urlVal;
            }

            const newApp = {
                name: document.getElementById('appName').value.trim(),
                url: urlVal,
                category: document.getElementById('appCategory').value.trim(),
                icon: document.getElementById('appIcon').value.trim() || '🌐',
                desc: document.getElementById('appDesc').value.trim()
            };

            if (index === '') {
                apps.push(newApp);
            } else {
                apps[index] = newApp;
            }

            persistApps(apps);
            closeModal();
            render();
        }

        function editApp(index) { openModal(index); }

        function deleteApp(index) {
            if (confirm(`คุณต้องการลบ "${apps[index].name}" ใช่หรือไม่?`)) {
                apps.splice(index, 1);
                persistApps(apps);
                render();
            }
        }

        // รันการแสดงผลทันทีที่โหลดหน้าเว็บ
        document.addEventListener('DOMContentLoaded', render);
        // เผื่อกรณี DOM โหลดเสร็จก่อน
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            render();
        }
    </script>
</body>
</html>
